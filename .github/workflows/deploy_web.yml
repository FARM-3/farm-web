name: React Web Client CI Tests

# 1. WHEN to run the workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. WHAT to do
jobs:
  test:
    runs-on: ubuntu-latest
    
    # Defaults to the working directory where the repository is checked out
    # If your code is NOT in the root and is inside a 'web' folder, you might need to add:
    # defaults:
    #   run:
    #     working-directory: ./web 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup Node.js Environment (React/Vite requirement)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use the Node.js version you develop with

      # 4. Install Dependencies
      - name: Install Node Dependencies
        run: npm install

      # 5. Run Build Check (Recommended for Frontend CI)
      # This ensures the code can successfully compile, catching configuration errors.
      - name: Check Production Build
        run: npm run build

      # 6. Upload build artifacts for deployment
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "~/frontend-web/dist/"
          strip_components: 1

      - name: Restart Services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🔄 Restarting nginx to serve new build..."
            docker restart rugyeyo-nginx-webapp
            echo "✅ Deployment completed successfully!"