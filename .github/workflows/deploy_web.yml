name: React Web Client CI Tests

# 1. WHEN to run the workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 2. WHAT to do
jobs:
  test:
    runs-on: ubuntu-latest
    
    # Defaults to the working directory where the repository is checked out
    # If your code is NOT in the root and is inside a 'web' folder, you might need to add:
    # defaults:
    #   run:
    #     working-directory: ./web 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Setup Node.js Environment (React/Vite requirement)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use the Node.js version you develop with

      # 4. Install Dependencies
      - name: Install Node Dependencies
        run: npm install

      # 5. Run Build Check (Recommended for Frontend CI)
      # This ensures the code can successfully compile, catching configuration errors.
      - name: Check Production Build
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Digital Ocean Droplet
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ~/frontend-web/web
            git fetch origin main
            # Check if package.json or package-lock.json changed
            if git diff HEAD origin/main --name-only | grep -qE "package(-lock)?.json"; then
              echo "Dependencies changed, rebuilding Docker container..."
              git pull origin main
              cd ~
              docker-compose build frontend-web-builder
              docker-compose up -d frontend-web-builder
            else
              echo "Only code changed, skipping Docker rebuild..."
              git pull origin main
            fi
            cd ~
            docker restart rugyeyo-nginx-webapp